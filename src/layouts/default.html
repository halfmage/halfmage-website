<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halfmage | Design, Development & SEO by Gerrit Halfmann</title>
    <meta name="description" content="Design, development, SEO and GEO. One person, no handoffs, no overhead. Working with startups and SMEs across Europe and the US since 2005.">

    <link rel="canonical" href="https://halfmage.com{{ page.url }}">

    <link rel="shortcut icon" href="favicon.png" type="image/x-icon">
    <meta name="theme-color" content="#fafafa">

    <!-- Facebook Meta Tags -->
    <meta property="og:url" content="https://halfmage.com{{ page.url }}">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Halfmage | Design, Development & SEO by Gerrit Halfmann">
    <meta property="og:description" content="Design, development, SEO and GEO. One person, no handoffs, no overhead. Working with startups and SMEs across Europe and the US since 2005.">
    <meta property="og:image" content="https://halfmage.com/images/social.png">

    <!-- Twitter Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@halfmage" />
    <meta name="twitter:title" content="Halfmage | Design, Development & SEO by Gerrit Halfmann">
    <meta name="twitter:description" content="Design, development, SEO and GEO. One person, no handoffs, no overhead. Working with startups and SMEs across Europe and the US since 2005.">
    <meta name="twitter:image" content="https://halfmage.com/images/social.png">

    <link rel="stylesheet" href="/style.css?v={% version %}" />

    <script type="application/ld+json">
        {
          "@context": "https://schema.org",
          "@type": "FAQPage",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "What kind of projects do you work on?",
              "acceptedAnswer": {"@type":"Answer","text":"I work on full redesigns, web applications, design systems, branding, and SEO/GEO optimization for startups and established SMEs."}
            },
            {
              "@type": "Question",
              "name": "How fast can you move?",
              "acceptedAnswer": {"@type":"Answer","text":"Most projects launch in 1–3 months with 2–4 updates per week."}
            },
            {
              "@type": "Question",
              "name": "Do you only work with big companies?",
              "acceptedAnswer": {"@type":"Answer","text":"Not at all. I work with funded startups, SMEs, and established companies across Europe and the US."}
            },
            {
              "@type": "Question",
              "name": "What’s included in the monthly price?",
              "acceptedAnswer": {"@type":"Answer","text":"Design: UI/UX, branding, design systems. Design+Dev: full-stack development, hosting setup, integrations, support."}
            }
          ]
        }
        </script>

    <script type="application/ld+json">
        {
          "@context": "https://schema.org",
          "@type": "Person",
          "name": "Gerrit Halfmann",
          "url": "https://halfmage.com",
          "sameAs": [
            "https://gerrithalfmann.com",
            "https://twitter.com/halfmage"
          ],
          "jobTitle": "Creative Technologist",
          "description": "Designer, developer and SEO/GEO specialist building for the web since 2005. Working with funded startups and SMEs across Europe and the US.",
          "worksFor": {
            "@type": "Organization",
            "name": "Halfmage",
            "url": "https://halfmage.com"
          }
        }
        </script>

</head>
