    <script>
        (function() {
            var stickyCta = document.getElementById('sticky-cta');
            if (!stickyCta) return;
            var shown = false;
            window.addEventListener('scroll', function() {
                var shouldShow = window.scrollY > 600;
                if (shouldShow !== shown) {

                    stickyCta.style.transform = shown ? 'translateY(0)' : 'translateY(-100%)';

            });
        })();
